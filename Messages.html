<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages</title>
    <style>
    body {
        margin: 0;
        min-height: 100vh;
        background: #0b1020;
        color: white;
        font-family: Arial, sans-serif;
        padding: 30px 15px;
    }
        #loginBox {
    width: 90%;
    max-width: 400px;
    margin: 80px auto 0;
    padding: 30px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 20px;
    text-align: center;
    box-sizing: border-box;
        }
        #passwordInput {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    margin: 15px 0;
    border: 1px solid #4a5268;
    border-radius: 10px;
    background: rgba(0, 0, 0, 0.2);
    color: white;
    font-size: 16px;
        }
        #loginBtn {
    background: white;
    color: #0b1020;
    border: none;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 16px;
    cursor: pointer;
}

#loginStatus {
    color: #ff7b7b;
    font-size: 14px;
    min-height: 20px;
}
        #messagesContent {
    width: 90%;
    max-width: 650px;
    margin: 30px auto;
}

#messagesContent h1 {
    text-align: center;
    margin-bottom: 30px;
}
        #messagesList > div {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 15px;
}

#messagesList h3 {
    margin-top: 0;
    margin-bottom: 15px;
    font-size: 17px;
}
        #messagesList audio {
    width: 100%;
    display: block;
}

#messagesList > div:last-child {
    margin-bottom: 0;
}
        #messagesContent h1 {
    font-size: 30px;
    margin-top: 0;
}

#messagesContent {
    padding-bottom: 30px;
}
        #passwordInput:focus {
    outline: none;
    border-color: rgba(255, 255, 255, 0.5);
}

#loginBtn:hover {
    opacity: 0.85;
}
        #messagesList {
    display: flex;
    flex-direction: column;
    gap: 15px;
}

@media (max-width: 480px) {
    #loginBox {
        margin-top: 40px;
        padding: 24px;
    }

    #messagesContent {
        width: 100%;
    }
}
        
    </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://wpkxfkxdflaujxgcgnas.supabase.co";
const SUPABASE_KEY = "sb_publishable_U4fIpKJ40XrJ6-zCMtdYPQ_v2Kr3Mut";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
  
  
</script>
</head>

<body>

    <div id="loginBox">
        <h1>Private Messages</h1>

        <input
            type="password"
            id="passwordInput"
            placeholder="Enter password"
        >

        <button id="loginBtn">🔓 Unlock</button>

        <p id="loginStatus"></p>
    </div>

    <div id="messagesContent" style="display:none;">
        <h1>Messages</h1>

        <div id="messagesList"></div>
    </div>

    <div id="messagesList"></div>
<script>
const messagesList = document.getElementById("messagesList");

async function loadMessages() {

    const { data, error } = await supabaseClient
        .from("greetings")
        .select("audio_path")
        .order("id", { ascending: true });

    if (error) {
        console.error(error);
        messagesList.textContent = "Unable to load messages.";
        return;
    }

    messagesList.innerHTML = "";

    data.forEach((message, index) => {

        const container = document.createElement("div");

        const title = document.createElement("h3");
        title.textContent =
            `🎙️ ${index + 1}${getOrdinal(index + 1)} Message`;

        const audio = document.createElement("audio");
        audio.controls = true;

        const { data: publicURL } =
            supabaseClient
                .storage
                .from("greetings")
                .getPublicUrl(message.audio_path);

        audio.src = publicURL.publicUrl;

        container.appendChild(title);
        container.appendChild(audio);

        messagesList.appendChild(container);
    });
}

function getOrdinal(number) {

    if (number % 100 >= 11 && number % 100 <= 13) {
        return "th";
    }

    switch (number % 10) {
        case 1: return "st";
        case 2: return "nd";
        case 3: return "rd";
        default: return "th";
    }
}

loadMessages();

    const loginBox = document.getElementById("loginBox");
const messagesContent = document.getElementById("messagesContent");
const passwordInput = document.getElementById("passwordInput");
const loginBtn = document.getElementById("loginBtn");
const loginStatus = document.getElementById("loginStatus");

const PASSWORD = "Chano";

loginBtn.addEventListener("click", () => {

    if (passwordInput.value === PASSWORD) {

        loginBox.style.display = "none";
        messagesContent.style.display = "block";

        loginStatus.textContent = "";

    } else {

        loginStatus.textContent = "❌ Incorrect password.";
        passwordInput.value = "";
    }
});
</script>
</body>
</html>
