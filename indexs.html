    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);

        #status .hourglass {
    animation: hourglassFlip 1.5s ease-in-out infinite;
    transform-origin: center;
}

@keyframes hourglassFlip {
    0%, 40% {
        transform: rotate(0deg);
    }
    50%, 90% {
        transform: rotate(180deg);
    }
    100% {
        transform: rotate(180deg);
    }
}
        
    </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://wpkxfkxdflaujxgcgnas.supabase.co";
const SUPABASE_KEY = "sb_publishable_U4fIpKJ40XrJ6-zCMtdYPQ_v2Kr3Mut";

const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);
  

</script>
</head>

<body>
<div class="card">
    <h1>Record a Message</h1>

    <button id="recordBtn"><svg
    width="20"
    height="20"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
>
    <rect x="9" y="2" width="6" height="12" rx="3"></rect>
    <path d="M5 10a7 7 0 0 0 14 0"></path>
    <line x1="12" y1="19" x2="12" y2="22"></line>
    <line x1="8" y1="22" x2="16" y2="22"></line>
</svg>
Record</button>

    <p id="status">Press Record to start.</p>

    <audio id="audioPreview" controls style="display:none;"></audio>

    <button id="submitBtn">
    <svg width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M22 2L11 13"></path>
        <path d="M22 2L15 22L11 13L2 9L22 2Z"></path>
    </svg>
    <span>Submit Message</span>
    </button>
  <br>

<button onclick="window.location.href='Messages.html'">
    <svg width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
    </svg>
    <span>View Messages</span>
    </button>
  <script>
const recordBtn = document.getElementById("recordBtn");
const submitBtn = document.getElementById("submitBtn");
const audioPreview = document.getElementById("audioPreview");
const status = document.getElementById("status");

let mediaRecorder;
let audioChunks = [];
let audioBlob;

recordBtn.addEventListener("click", async () => {

    if (!mediaRecorder || mediaRecorder.state === "inactive") {

        try {
            const stream =
                await navigator.mediaDevices.getUserMedia({
                    audio: {
    echoCancellation: false,
    noiseSuppression: false,
    autoGainControl: false
                    }
                });

            audioChunks = [];
            mediaRecorder = new MediaRecorder(stream);

            mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) {
                    audioChunks.push(event.data);
                }
            };

            mediaRecorder.onstop = () => {

                stream.getTracks().forEach(track => track.stop());

                audioBlob = new Blob(audioChunks, {
                    type: "audio/webm"
                });

                audioPreview.src =
                    URL.createObjectURL(audioBlob);

                audioPreview.style.display = "block";
                submitBtn.style.display = "inline-block";

                status.textContent =
                    "Recording finished. You can listen to it.";
            };

            mediaRecorder.start();

            recordBtn.innerHTML = `
    <svg width="20" height="20" viewBox="0 0 24 24"
        fill="currentColor">
        <rect x="6" y="6" width="12" height="12" rx="2"></rect>
    </svg>
    Stop Recording
`;
            status.innerHTML = `
    <svg width="16" height="16" viewBox="0 0 24 24"
        fill="currentColor">
        <circle cx="12" cy="12" r="6"></circle>
    </svg>
    <span>Recording...</span>
`;
        } catch (error) {
            console.error(error);
            status.textContent =
                "Microphone permission was denied or unavailable.";
        }

    } else if (mediaRecorder.state === "recording") {

        mediaRecorder.stop();

        recordBtn.innerHTML = `
    <svg width="20" height="20" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"></rect>
        <path d="M5 10a7 7 0 0 0 14 0"></path>
        <line x1="12" y1="19" x2="12" y2="22"></line>
        <line x1="8" y1="22" x2="16" y2="22"></line>
    </svg>
    Record Again
`;
    }
});
  submitBtn.addEventListener("click", async () => {

    if (!audioBlob) return;

    status.innerHTML = `
    <svg class="hourglass" width="18" height="18"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round">
        <path d="M6 2h12"></path>
        <path d="M6 22h12"></path>
        <path d="M7 2c0 5 5 5 5 10s-5 5-5 10"></path>
        <path d="M17 2c0 5-5 5-5 10s5 5 5 10"></path>
    </svg>
    <span>Uploading message...</span>
`;

    const fileName = `message_${Date.now()}.webm`;

    const { error: uploadError } =
        await supabaseClient
            .storage
            .from("greetings")
            .upload(fileName, audioBlob, {
                contentType: "audio/webm"
            });

    if (uploadError) {
        console.error(uploadError);
        status.innerHTML = `
    <svg width="16" height="16" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <line x1="9" y1="9" x2="15" y2="15"></line>
        <line x1="15" y1="9" x2="9" y2="15"></line>
    </svg>
    <span>Upload failed.</span>
`;
        return;
    }

    const { error: databaseError } =
        await supabaseClient
            .from("greetings")
            .insert({
                audio_path: fileName
            });

    if (databaseError) {
        console.error(databaseError);
        status.innerHTML = `
    <svg width="16" height="16" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="9"></circle>
        <line x1="9" y1="9" x2="15" y2="15"></line>
        <line x1="15" y1="9" x2="9" y2="15"></line>
    </svg>
    <span>Message uploaded, but saving failed.</span>
`;
        return;
    }

    status.innerHTML = `
    <svg width="16" height="16" viewBox="0 0 24 24"
        fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 6L9 17l-5-5"></path>
    </svg>
    <span>Message submitted!</span>
`;
</script>
</div>
</body>
</html>
